# Supabase CLI — configuração versionada do Finora.
# Fonte de verdade da infraestrutura de banco. NÃO alterar o banco pelo painel:
# o fluxo é  migration SQL -> Supabase CLI -> Postgres local -> tests -> staging -> prod.
# Nenhuma credencial aqui. Segredos ficam em .env.local / variáveis de ambiente.

project_id = "finora"

[db]
# Porta do Postgres local iniciado por `supabase start`
port = 54322
# Versão major do Postgres (alinhar com o projeto remoto ao provisionar)
major_version = 15

[db.migrations]
# Migrações versionadas em supabase/migrations, aplicadas em ordem
schema_paths = []

[studio]
enabled = true
port = 54323

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]

[auth]
# URL de retorno do app em desenvolvimento (ajustar por ambiente)
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
# Sessão: expiração alinhada ao design (24h de inatividade) — Req 1.4, 21.5
jwt_expiry = 86400
enable_signup = true

[auth.email]
enable_signup = true
# Política de senha (mín. 8, letra + dígito) é validada na aplicação (AUTH-001)
enable_confirmations = true

# Google OAuth (AUTH-001). Habilitar quando as credenciais existirem;
# secrets via variáveis de ambiente, nunca no arquivo.
[auth.external.google]
enabled = false
client_id = ""
secret = ""

[analytics]
enabled = false
